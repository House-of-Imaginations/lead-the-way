name: Bug
description: Something is broken or wrong
labels: ["bug"]
body:
  - type: dropdown
    id: team
    attributes:
      label: Team
      description: Leave it on Engineering unless the fix is copy, content or a decision.
      options: [Engineering, Business, Both]
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - p0 - demo blocker
        - p1 - wanted for the demo
        - p2 - nice to have
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
      placeholder: |
        1. Signed up with a new email
        2. Landed on a 404
        Expected the home screen.
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Where
      description: URL, screen, or function. Add the browser and device if it might matter.
      placeholder: /settings on iOS Safari
    validations: { required: false }
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot, recording or error text
      description: Paste errors as text where you can. A screenshot of a console is hard to search.
    validations: { required: false }
