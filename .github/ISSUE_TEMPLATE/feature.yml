name: Feature
description: Something new that a user would notice
labels: ["enhancement"]
body:
  - type: dropdown
    id: team
    attributes:
      label: Team
      description: Who owns this. "Both" only when neither team can finish it alone.
      options: [Engineering, Business, Both]
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - p0 - demo blocker
        - p1 - wanted for the demo
        - p2 - nice to have
    validations: { required: true }
  - type: textarea
    id: who
    attributes:
      label: Who wants this and why
      description: The person and the problem. No solution yet.
      placeholder: A judge opening the demo cold cannot tell what the product does in ten seconds.
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Done looks like
      description: What is true when this closes. Write it so someone else can check it without asking you.
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [frontend, backend, auth, infra, content, not sure]
    validations: { required: false }
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, screenshots, constraints, anything the owner would otherwise have to ask for.
    validations: { required: false }
