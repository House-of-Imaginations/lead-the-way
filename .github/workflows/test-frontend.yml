name: Test (frontend)

on:
  push:
    branches: [main]
    paths:
      # The application and everything the checks read. A change outside this
      # list -- documentation, issue templates, agent skills, the architecture
      # diagram -- cannot change what any of these commands answer.
      - "convex/**"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "*.ts"
      - "*.mjs"
      # Editing this pipeline re-runs it. Otherwise a broken workflow file
      # stays green until unrelated application code happens to land.
      - ".github/workflows/test-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      # The application and everything the checks read. A change outside this
      # list -- documentation, issue templates, agent skills, the architecture
      # diagram -- cannot change what any of these commands answer.
      - "convex/**"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "*.ts"
      - "*.mjs"
      # Editing this pipeline re-runs it. Otherwise a broken workflow file
      # stays green until unrelated application code happens to land.
      - ".github/workflows/test-frontend.yml"

concurrency:
  group: test-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `tests/src` and `tests/scripts` -- the pure front-end and tooling
      # modules. No `next build` first: nothing under here imports generated
      # route types, so the build would be several minutes spent to change
      # nothing.
      #
      # No provider keys are set, deliberately. The suite must not reach the
      # network -- `tests/setup.ts` enforces it and fails the run if anything
      # tries, and a key in this environment would turn that guard into a bill.
      - run: pnpm vitest run tests/src tests/scripts
