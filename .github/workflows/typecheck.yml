name: Typecheck

on:
  push:
    branches: [main]
    paths:
      # The application and everything the checks read. A change outside this
      # list -- documentation, issue templates, agent skills, the architecture
      # diagram -- cannot change what any of these commands answer.
      - "convex/**"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "scripts/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "*.ts"
      - "*.mjs"
      # Editing this pipeline re-runs it. Otherwise a broken workflow file
      # stays green until unrelated application code happens to land.
      - ".github/workflows/typecheck.yml"
  pull_request:
    branches: [main]
    paths:
      # The application and everything the checks read. A change outside this
      # list -- documentation, issue templates, agent skills, the architecture
      # diagram -- cannot change what any of these commands answer.
      - "convex/**"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "scripts/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "*.ts"
      - "*.mjs"
      # Editing this pipeline re-runs it. Otherwise a broken workflow file
      # stays green until unrelated application code happens to land.
      - ".github/workflows/typecheck.yml"

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # BEFORE the typecheck, not after. `next build` writes the route types
      # under `.next/types` that `tsc` needs, so a typecheck on a clean checkout
      # fails without it. The build also needs a Convex URL to be a valid URL --
      # nothing is deployed and nothing is called, so a placeholder is correct
      # here, and a real deployment URL would be a secret this job does not need.
      - run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example-000.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://example-000.convex.site

      - run: pnpm typecheck
