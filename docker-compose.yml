# Local Convex backend. `npx convex dev` talks to this instead of the cloud when
# CONVEX_SELF_HOSTED_URL and CONVEX_SELF_HOSTED_ADMIN_KEY are set in .env.local.
#
#   docker compose up -d
#   docker compose exec backend ./generate_admin_key.sh
#
# The deployment keeps its own environment (SITE_URL, BETTER_AUTH_SECRET, ...);
# set those with `npx convex env set`, not in .env.local.
services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210" # client API
      - "3211:3211" # HTTP actions, the .site origin
    volumes:
      - data:/convex/data
    environment:
      - INSTANCE_NAME=lead-the-way
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      - DISABLE_BEACON=true
      - REDACT_LOGS_TO_CLIENT=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3210
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
